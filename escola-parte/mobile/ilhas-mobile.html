<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Mindfine - Oceano Mágico</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-image: url('../fundos/fundo-mar.png');
            background-color: #32B5F1;
            background-size: cover;
            background-attachment: fixed;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Header Mobile */
        .mobile-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: rgba(0,0,0,0.3);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-left {
            display: flex;
            gap: 12px;
        }

        .btn-circle {
            background: white;
            color: #32B5F1;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
        }

        .xp-container {
            flex: 1;
            max-width: 200px;
            margin: 0 12px;
        }

        .xp-bar {
            height: 8px;
            background: rgba(0,0,0,0.2);
            border-radius: 10px;
            overflow: hidden;
        }

        .xp-fill {
            height: 100%;
            background: white;
            width: 0%;
        }

        .xp-text {
            font-size: 9px;
            color: white;
            font-weight: 800;
            margin-bottom: 3px;
            display: flex;
            justify-content: space-between;
        }

        .level-display {
            background: white;
            color: #32B5F1;
            padding: 6px 12px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .level-display img {
            width: 16px;
        }

        /* Mapa */
        #ocean-map {
            position: relative;
            width: 100%;
            padding: 80px 12px 40px;
            min-height: 100vh;
        }

        .island-wrapper {
            position: relative;
            width: 100%;
            margin-bottom: 60px;
            cursor: pointer;
        }

        .location-pin {
            display: flex;
            justify-content: center;
            margin-bottom: -20px;
            position: relative;
            z-index: 5;
        }

        .pin-head {
            width: 60px;
            height: 60px;
            background: white;
            border-radius: 50%;
            border: 3px solid #32B5F1;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px rgba(50,181,241,0.5);
        }

        .pin-head img {
            width: 80%;
            height: 80%;
            object-fit: contain;
            border-radius: 50%;
        }

        .pin-head i {
            font-size: 24px;
            color: #32B5F1;
        }

        .island-img {
            width: 100%;
            max-width: 280px;
            display: block;
            margin: 0 auto;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.3));
        }

        .wood-sign {
            background: white;
            color: #32B5F1;
            text-align: center;
            padding: 8px 16px;
            border-radius: 30px;
            font-weight: 800;
            font-size: 12px;
            width: fit-content;
            margin: -15px auto 0;
            position: relative;
            z-index: 6;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .lock-bubble {
            position: absolute;
            top: -50px;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 800;
            color: #32B5F1;
            white-space: nowrap;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            z-index: 20;
        }

        .lock-bubble::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-top: 8px solid white;
        }

        .lock-bubble button {
            background: #32B5F1;
            color: white;
            border: none;
            border-radius: 20px;
            padding: 4px 10px;
            margin-top: 6px;
            font-size: 10px;
            font-weight: 800;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            z-index: 300;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.open {
            display: flex;
        }

        .treasure-container {
            text-align: center;
        }

        .treasure-chest {
            width: 200px;
            cursor: pointer;
        }

        .sticker-pack {
            width: 150px;
            margin-top: 20px;
            display: none;
        }

        .sticker-pack.revealed {
            display: block;
            animation: pop 0.5s ease-out;
        }

        @keyframes pop {
            from { transform: scale(0); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .flash-overlay {
            position: fixed;
            inset: 0;
            background: white;
            z-index: 400;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .flash-overlay.active {
            opacity: 1;
        }

        .album-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 100;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            border: 2px solid #32B5F1;
        }

        .album-btn i {
            font-size: 24px;
            color: #32B5F1;
        }

        .album-btn.blink {
            animation: blink 0.5s infinite;
        }

        @keyframes blink {
            0%,100% { transform: scale(1); }
            50% { transform: scale(1.1); box-shadow: 0 0 20px #32B5F1; }
        }

        .glitter-particle {
            position: absolute;
            width: 8px;
            height: 8px;
            background: gold;
            border-radius: 50%;
            pointer-events: none;
        }

        .mini-sticker {
            position: fixed;
            width: 40px;
            height: 40px;
            pointer-events: none;
            z-index: 500;
        }

        .nova-ilha {
            animation: pulse 0.8s infinite;
        }

        @keyframes pulse {
            0%,100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }
    </style>
</head>
<body>

<div class="mobile-header">
    <div class="header-left">
        <button class="btn-circle" onclick="window.location.href='inicial-mobile.html'"><i class="fas fa-arrow-left"></i></button>
        <button class="btn-circle" id="btnSom"><i class="fas fa-volume-up"></i></button>
    </div>
    <div class="xp-container">
        <div class="xp-text"><span id="xpText">XP: 0/100</span><span id="levelText">NV. 1</span></div>
        <div class="xp-bar"><div class="xp-fill" id="xpFill"></div></div>
    </div>
    <div class="level-display">
        <img src="../itens/mindcoin.png" alt="coin">
        <span id="coinCount">0</span>
    </div>
</div>

<button class="album-btn" id="albumBtn"><i class="fas fa-book"></i></button>

<div id="ocean-map"></div>

<div class="modal-overlay" id="treasureModal">
    <div class="treasure-container">
        <img src="../itens/bau-fechado.png" class="treasure-chest" id="treasureChest">
        <img src="../itens/album-de-figurinhas.png" class="sticker-pack" id="stickerPack">
    </div>
</div>

<div class="flash-overlay" id="flashOverlay"></div>

<script>
    let matriculaAtual = '';
    let somAtivo = true;
    let melhorPontuacao = 0;

    const dadosIlhas = [
        { nome: "Porto Inicial", ilhaImg: "../ilhas/ilha1.png", pinImg: "../pandas/skin.png", desbloqueada: true },
        { nome: "Baía Pirata", ilhaImg: "../ilhas/ilha-pirata.png", pinImg: "../pandas/skin.png", desbloqueada: false },
        { nome: "Recife Bruxo", ilhaImg: "../ilhas/ilha-bruxo.png", pinImg: "../pandas/skin.png", desbloqueada: false },
        { nome: "Encosta Brasileira", ilhaImg: "../ilhas/ilha-Brasil.png", pinImg: "../pandas/icone-brasil.png", desbloqueada: false },
        { nome: "Recife Musical", ilhaImg: "../ilhas/ilha-musica.png", pinImg: "../pandas/icone-musica.png", desbloqueada: false },
        { nome: "Encosta Chinesa", ilhaImg: "../ilhas/ilha-china.png", pinImg: "../pandas/icone-china.png", desbloqueada: false },
        { nome: "Baía das Bailarinas", ilhaImg: "../ilhas/ilha2.png", pinImg: "../pandas/icone-ballet.png", desbloqueada: false },
        { nome: "Ilha Astronauta", ilhaImg: "../ilhas/ilha-astronauta.png", pinImg: "../pandas/icone-espaco.png", desbloqueada: false }
    ];

    let novaIlhaDesbloqueada = null;

    // Toast
    function showToast(msg, isError = false) {
        const toast = document.createElement('div');
        toast.style.cssText = 'position:fixed; bottom:80px; left:20px; right:20px; background:#333; color:white; padding:10px; border-radius:10px; text-align:center; font-size:12px; z-index:400;';
        toast.innerText = (isError ? '❌ ' : '✅ ') + msg;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }

    // Carregar dados do usuário
    async function carregarDados() {
        const usuario = JSON.parse(localStorage.getItem('usuario') || '{}');
        matriculaAtual = usuario.matricula;
        if (!matriculaAtual) {
            window.location.href = 'login-mobile.html';
            return;
        }
        try {
            const response = await fetch(`https://mindfine-backend.onrender.com/api/progresso/${matriculaAtual}`);
            const dados = await response.json();
            document.getElementById('coinCount').innerText = dados.moedas || 0;
            document.getElementById('xpText').innerText = `XP: ${dados.xp || 0}/100`;
            document.getElementById('levelText').innerText = `NV. ${dados.nivel || 1}`;
            document.getElementById('xpFill').style.width = (dados.xp || 0) + '%';
        } catch (error) {
            console.error(error);
        }
    }

    // Desbloquear universo
    async function desbloquearUniverso(nomeIlha) {
        const mapaUniverso = {
            "Porto Inicial": "Santuário",
            "Baía Pirata": "Ilha do Pirata",
            "Recife Bruxo": "Ilha do Bruxo",
            "Encosta Brasileira": "Ilha do Brasil",
            "Encosta Chinesa": "Ilha da China",
            "Baía das Bailarinas": "Ilha dos Piratas"
        };
        const nomeUniverso = mapaUniverso[nomeIlha];
        if (!nomeUniverso) return;
        
        try {
            const response = await fetch(`https://mindfine-backend.onrender.com/api/progresso/${matriculaAtual}`);
            const dados = await response.json();
            const universosAtuais = dados.universos_desbloqueados || [];
            if (universosAtuais.includes(nomeUniverso)) return;
            universosAtuais.push(nomeUniverso);
            await fetch(`https://mindfine-backend.onrender.com/api/progresso/${matriculaAtual}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ universos_desbloqueados: universosAtuais })
            });
            showToast(`🌍 Novo universo: ${nomeUniverso}!`);
        } catch (error) { console.error(error); }
    }

    // Desbloquear figurinhas iniciais
    async function desbloquearPacoteFigurinhas() {
        const figurinhas = [
            { pagina: 'capa-back', slot: 0, figurinha_id: 'fig_capa-back_0' },
            { pagina: 'capa-back', slot: 1, figurinha_id: 'fig_capa-back_1' },
            { pagina: 'capa-back', slot: 2, figurinha_id: 'fig_capa-back_2' },
            { pagina: 'capa-back', slot: 3, figurinha_id: 'fig_capa-back_3' }
        ];
        let desbloqueadas = 0;
        for (const fig of figurinhas) {
            try {
                await fetch('https://mindfine-backend.onrender.com/api/figurinhas/desbloquear', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ...fig, matricula: matriculaAtual })
                });
                desbloqueadas++;
            } catch(e) {}
        }
        showToast(`📦 ${desbloqueadas} figurinhas da Ilha Inicial!`);
    }

    // Construir mapa
    function buildMap() {
        const container = document.getElementById('ocean-map');
        container.innerHTML = '';
        
        dadosIlhas.forEach((ilha, idx) => {
            const wrapper = document.createElement('div');
            wrapper.className = 'island-wrapper';
            if (novaIlhaDesbloqueada === idx) wrapper.classList.add('nova-ilha');
            
            wrapper.innerHTML = `
                <div class="location-pin">
                    <div class="pin-head">
                        ${ilha.desbloqueada ? `<img src="${ilha.pinImg}" onerror="this.src='https://via.placeholder.com/50'">` : '<i class="fas fa-lock"></i>'}
                    </div>
                </div>
                <img src="${ilha.ilhaImg}" class="island-img" onerror="this.src='https://via.placeholder.com/280x150?text=Ilha'">
                <div class="wood-sign">${ilha.nome}</div>
            `;
            
            wrapper.onclick = () => clicarIlha(ilha, idx, wrapper);
            container.appendChild(wrapper);
        });
    }

    async function clicarIlha(ilha, idx, wrapper) {
        if (ilha.desbloqueada) {
            const ehNova = novaIlhaDesbloqueada === idx;
            await abrirBau(ehNova);
            if (ehNova) wrapper.classList.remove('nova-ilha');
        } else {
            const nivelNecessario = (idx + 1) * 2;
            const custoCoins = (idx + 1) * 500;
            
            const bubble = document.createElement('div');
            bubble.className = 'lock-bubble';
            bubble.innerHTML = `
                <div>Nível ${nivelNecessario} necessário</div>
                <button onclick="event.stopPropagation(); comprarIlha(this, ${idx}, ${custoCoins})">💰 ${custoCoins} MindCoins</button>
            `;
            wrapper.appendChild(bubble);
            setTimeout(() => bubble.remove(), 4000);
        }
    }

    async function comprarIlha(btn, idx, custo) {
        const coinDisplay = document.getElementById('coinCount');
        let moedas = parseInt(coinDisplay.innerText);
        if (moedas >= custo) {
            coinDisplay.innerText = moedas - custo;
            dadosIlhas[idx].desbloqueada = true;
            await desbloquearUniverso(dadosIlhas[idx].nome);
            document.getElementById('flashOverlay').classList.add('active');
            setTimeout(() => document.getElementById('flashOverlay').classList.remove('active'), 400);
            buildMap();
            const novasIlhas = document.querySelectorAll('.island-wrapper');
            if (novasIlhas[idx]) novasIlhas[idx].scrollIntoView({ behavior: 'smooth', block: 'center' });
            showToast(`🎉 ${dadosIlhas[idx].nome} desbloqueada!`);
        } else {
            showToast("Moedas insuficientes!", true);
        }
    }

    async function abrirBau(comFigurinha) {
        const modal = document.getElementById('treasureModal');
        const chest = document.getElementById('treasureChest');
        const pack = document.getElementById('stickerPack');
        
        modal.classList.add('open');
        chest.src = "../itens/bau-fechado.png";
        pack.style.display = 'none';
        
        chest.onclick = async () => {
            chest.src = "../itens/bau-aberto.png";
            if (comFigurinha) {
                await desbloquearPacoteFigurinhas();
                pack.style.display = 'block';
                pack.classList.add('revealed');
                setTimeout(() => {
                    voarParaAlbum();
                }, 1500);
            } else {
                setTimeout(() => {
                    modal.classList.remove('open');
                }, 1000);
            }
        };
    }

    function voarParaAlbum() {
        const modal = document.getElementById('treasureModal');
        const albumBtn = document.getElementById('albumBtn');
        const albumRect = albumBtn.getBoundingClientRect();
        
        for (let i = 0; i < 15; i++) {
            const sticker = document.createElement('img');
            sticker.src = "../itens/album-de-figurinhas.png";
            sticker.className = 'mini-sticker';
            sticker.style.left = '50%';
            sticker.style.top = '50%';
            sticker.style.transform = 'translate(-50%, -50%)';
            document.body.appendChild(sticker);
            
            sticker.animate([
                { transform: 'translate(-50%, -50%) scale(1)', opacity: 1 },
                { transform: `translate(${albumRect.left - window.innerWidth/2 + 25}px, ${albumRect.top - window.innerHeight/2 + 25}px) scale(0.2)`, opacity: 0 }
            ], { duration: 800 }).onfinish = () => sticker.remove();
        }
        
        setTimeout(() => {
            modal.classList.remove('open');
            document.getElementById('albumBtn').classList.add('blink');
            setTimeout(() => document.getElementById('albumBtn').classList.remove('blink'), 3000);
            showToast("✨ Novas figurinhas! Clique no álbum ✨");
        }, 800);
    }

    // Som
    const audio = new Audio('../sons/mar-agitado.mp3');
    audio.loop = true;
    
    function toggleSom() {
        const btn = document.getElementById('btnSom');
        if (audio.paused) {
            audio.play();
            btn.innerHTML = '<i class="fas fa-volume-up"></i>';
        } else {
            audio.pause();
            btn.innerHTML = '<i class="fas fa-volume-mute"></i>';
        }
    }
    
    document.getElementById('btnSom').onclick = toggleSom;
    document.getElementById('albumBtn').onclick = () => window.location.href = 'album-mobile.html';

    // Inicializar
    carregarDados().then(() => {
        buildMap();
        audio.play().catch(e => console.log('Áudio bloqueado'));
    });
</script>
</body>
</html>
