<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Mindfine - Caça-Palavras</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: "Montserrat", sans-serif; background: #000; min-height: 100vh; }
        .bg { position: fixed; width: 100%; height: 100%; background-image: url("../fundos/fundo-a.png"); background-size: cover; filter: blur(8px); z-index: -1; }
        .header { position: fixed; top: 0; left: 0; right: 0; background: white; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; z-index: 10; }
        .back { color: #32B5F1; font-size: 18px; text-decoration: none; }
        .container { margin: 70px 12px 20px; background: rgba(255,255,255,0.95); border-radius: 24px; padding: 16px; }
        .screen { display: none; }
        .screen.active { display: block; }
        .menu-btn { width: 100%; padding: 14px; margin: 8px 0; background: white; border: 2px solid #32B5F1; border-radius: 30px; font-weight: 800; cursor: pointer; }
        .scoreboard { display: flex; gap: 12px; margin-bottom: 16px; }
        .score { flex: 1; background: #e1f5fe; padding: 8px; border-radius: 16px; text-align: center; }
        .grid { display: grid; gap: 3px; justify-content: center; margin: 12px 0; }
        .cell { width: 32px; height: 32px; background: white; border: 1px solid #ddd; display: flex; align-items: center; justify-content: center; font-weight: 800; border-radius: 8px; cursor: pointer; }
        .cell.selected { background: #32B5F1; color: white; }
        .cell.found { background: #0277bd; color: white; }
        .words { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 12px 0; }
        .word { padding: 5px 10px; background: #e1f5fe; border-radius: 20px; font-size: 11px; font-weight: 700; }
        .word.found { background: #ccc; text-decoration: line-through; }
        .message { text-align: center; font-size: 12px; font-weight: 800; margin: 10px 0; }
        .actions { display: flex; gap: 10px; margin-top: 10px; }
        .btn { flex: 1; padding: 12px; border-radius: 30px; font-weight: 800; cursor: pointer; text-align: center; border: 2px solid #32B5F1; background: white; }
        .btn-primary { background: #32B5F1; color: white; }
        @media (max-width: 480px) { .cell { width: 28px; height: 28px; font-size: 12px; } }
    </style>
</head>
<body>
<div class="bg"></div>
<div class="header"><a href="sala-de-jogos-mobile.html" class="back"><i class="fas fa-chevron-left"></i></a><h2>Caça-Palavras</h2><div style="width:30px"></div></div>
<div class="container">
    <div id="menu" class="screen active">
        <div class="message">Escolha o nível</div>
        <button class="menu-btn" onclick="startGame(8)">Iniciante (8x8)</button>
        <button class="menu-btn" onclick="startGame(10)">Intermediário (10x10)</button>
        <button class="menu-btn" onclick="startGame(12)">Mestre (12x12)</button>
    </div>
    <div id="game" class="screen">
        <div class="scoreboard"><div class="score"><div>Tema</div><div id="tema">-</div></div><div class="score"><div>Pontos</div><div id="pontos">0</div></div></div>
        <div id="grid" class="grid"></div>
        <div id="palavras" class="words"></div>
        <div id="msg" class="message">Encontre as palavras!</div>
        <div class="actions"><button class="btn" onclick="backToMenu()">Sair</button><button class="btn btn-primary" onclick="newGame()">Reiniciar</button></div>
    </div>
</div>
<script>
    let currentSize = 10;
    let grid = [];
    let wordsList = [];
    let foundWords = [];
    let selectedCells = [];
    let isSelecting = false;
    let score = 0;
    let currentTheme = null;

    const themes = {
        8: [{ name: "Cores", words: ["AZUL", "VERDE", "ROSA", "ROXO", "AMARELO"] }],
        10: [{ name: "Natureza", words: ["FLORESTA", "OCEANO", "MONTANHA", "NUVEM", "SOLAR", "ARVORE"] }],
        12: [{ name: "Mindfulness", words: ["MINDFULNESS", "PRESENCA", "RESPIRAR", "ATENCAO", "SILENCIO", "EQUILIBRIO"] }]
    };

    function startGame(size) {
        currentSize = size;
        document.getElementById("menu").classList.remove("active");
        document.getElementById("game").classList.add("active");
        newGame();
    }

    function backToMenu() {
        document.getElementById("game").classList.remove("active");
        document.getElementById("menu").classList.add("active");
    }

    function newGame() {
        score = 0;
        foundWords = [];
        selectedCells = [];
        document.getElementById("pontos").innerText = "0";
        
        const themeList = themes[currentSize];
        currentTheme = themeList[Math.floor(Math.random() * themeList.length)];
        document.getElementById("tema").innerText = currentTheme.name;
        wordsList = [...currentTheme.words];
        
        createGrid();
        placeWords();
        fillEmpty();
        render();
        document.getElementById("msg").innerText = "Encontre as palavras!";
    }

    function createGrid() {
        grid = Array(currentSize).fill().map(() => Array(currentSize).fill({ letter: "", found: false }));
    }

    function placeWords() {
        wordsList.forEach(word => {
            let placed = false;
            while (!placed) {
                const isHoriz = Math.random() > 0.5;
                const row = Math.floor(Math.random() * (isHoriz ? currentSize : currentSize - word.length));
                const col = Math.floor(Math.random() * (isHoriz ? currentSize - word.length : currentSize));
                let canPlace = true;
                for (let i = 0; i < word.length; i++) {
                    const r = isHoriz ? row : row + i;
                    const c = isHoriz ? col + i : col;
                    if (grid[r][c].letter && grid[r][c].letter !== word[i]) canPlace = false;
                }
                if (canPlace) {
                    for (let i = 0; i < word.length; i++) {
                        const r = isHoriz ? row : row + i;
                        const c = isHoriz ? col + i : col;
                        grid[r][c] = { letter: word[i], found: false };
                    }
                    placed = true;
                }
            }
        });
    }

    function fillEmpty() {
        const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        for (let r = 0; r < currentSize; r++) {
            for (let c = 0; c < currentSize; c++) {
                if (!grid[r][c].letter) grid[r][c] = { letter: letters[Math.floor(Math.random() * 26)], found: false };
            }
        }
    }

    function render() {
        const gridDiv = document.getElementById("grid");
        gridDiv.style.gridTemplateColumns = `repeat(${currentSize}, 32px)`;
        gridDiv.innerHTML = "";
        for (let r = 0; r < currentSize; r++) {
            for (let c = 0; c < currentSize; c++) {
                const cell = document.createElement("div");
                cell.className = "cell" + (grid[r][c].found ? " found" : "");
                cell.textContent = grid[r][c].letter;
                cell.onmousedown = () => startSelect(r, c);
                cell.onmouseenter = () => moveSelect(r, c);
                cell.ontouchstart = (e) => { e.preventDefault(); startSelect(r, c); };
                cell.ontouchmove = (e) => { e.preventDefault(); handleTouch(e); };
                cell.ontouchend = () => endSelect();
                gridDiv.appendChild(cell);
            }
        }
        document.getElementById("palavras").innerHTML = wordsList.map(w => `<div class="word ${foundWords.includes(w) ? "found" : ""}">${w}</div>`).join("");
    }

    let touchCells = [];
    function handleTouch(e) {
        const touch = e.touches[0];
        const target = document.elementFromPoint(touch.clientX, touch.clientY);
        if (target && target.classList.contains("cell")) {
            const index = Array.from(target.parentNode.children).indexOf(target);
            const r = Math.floor(index / currentSize);
            const c = index % currentSize;
            if (!touchCells.some(cell => cell.r === r && cell.c === c)) {
                touchCells.push({ r, c });
                updateSelectionTouch();
            }
        }
    }
    function updateSelectionTouch() {
        const allCells = document.querySelectorAll(".cell");
        allCells.forEach(cell => cell.classList.remove("selected"));
        touchCells.forEach(cell => {
            const idx = cell.r * currentSize + cell.c;
            if (allCells[idx]) allCells[idx].classList.add("selected");
        });
    }
    function startSelect(r, c) { isSelecting = true; selectedCells = [{ r, c }]; touchCells = [{ r, c }]; updateSelection(); }
    function moveSelect(r, c) {
        if (!isSelecting) return;
        if (!selectedCells.some(cell => cell.r === r && cell.c === c)) {
            selectedCells.push({ r, c });
            updateSelection();
        }
    }
    function updateSelection() {
        const allCells = document.querySelectorAll(".cell");
        allCells.forEach(cell => cell.classList.remove("selected"));
        selectedCells.forEach(cell => {
            const idx = cell.r * currentSize + cell.c;
            if (allCells[idx]) allCells[idx].classList.add("selected");
        });
    }
    function endSelect() {
        if (!isSelecting) return;
        isSelecting = false;
        touchCells = [];
        const word = selectedCells.map(cell => grid[cell.r][cell.c].letter).join("");
        const reversed = word.split("").reverse().join("");
        if (wordsList.includes(word) && !foundWords.includes(word)) markFound(word);
        else if (wordsList.includes(reversed) && !foundWords.includes(reversed)) markFound(reversed);
        selectedCells = [];
        render();
    }
    function markFound(word) {
        foundWords.push(word);
        selectedCells.forEach(cell => grid[cell.r][cell.c].found = true);
        score += 10;
        document.getElementById("pontos").innerText = score;
        render();
        if (foundWords.length === wordsList.length) document.getElementById("msg").innerText = "🎉 PARABÉNS! Você encontrou tudo! 🎉";
        else document.getElementById("msg").innerText = `✅ Encontrou "${word}"! +10 pontos`;
    }
    document.onmouseup = () => { if (isSelecting) endSelect(); };
</script>
</body>
</html>
