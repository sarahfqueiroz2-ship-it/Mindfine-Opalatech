<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Mindfine - Caça-Palavras</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        :root {
            --azul-bright: #32B5F1;
            --azul-escuro: #0277bd;
            --azul-claro: #e1f5fe;
            --branco: #ffffff;
            --fundo-transparente: rgba(255, 255, 255, 0.98);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { font-family: "Montserrat", sans-serif; min-height: 100vh; background: #000; display: flex; justify-content: center; align-items: center; padding: 20px 0; }
        .background-layer { position: fixed; width: 110%; height: 110%; background-image: url("../fundos/fundo-a.png"); background-size: cover; background-position: center; z-index: 0; left: -5%; top: -5%; filter: blur(8px) brightness(0.6); }
        .diary-header { position: fixed; top: 0; left: 0; width: 100%; background: white; padding: 12px 25px; display: flex; align-items: center; gap: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); z-index: 500; }
        .header-left { display: flex; align-items: center; gap: 15px; flex-grow: 1; }
        .back-btn { color: var(--azul-bright); font-size: 1.4rem; text-decoration: none; }
        .diary-title h2 { margin: 0; font-size: 1rem; color: var(--azul-escuro); font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
        .container { position: relative; z-index: 10; background: var(--fundo-transparente); padding: 25px; border-radius: 30px; box-shadow: 0 20px 60px rgba(0,0,0,0.4); text-align: center; width: 500px; max-width: 95vw; backdrop-filter: blur(10px); margin-top: 60px; }
        .screen { display: none; }
        .screen.active { display: block; }
        .scoreboard { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .score-bubble { background: var(--azul-claro); padding: 8px; border-radius: 15px; border: 1px solid rgba(50,181,241,0.2); }
        .score-label { font-size: 0.6rem; text-transform: uppercase; color: var(--azul-escuro); font-weight: 800; }
        .score-value { font-size: 1.1rem; color: var(--azul-escuro); font-weight: 800; }
        .grid-container { background: #fff; padding: 10px; border-radius: 20px; border: 2px solid var(--azul-claro); margin-bottom: 15px; display: inline-block; }
        .grid { display: grid; gap: 4px; user-select: none; }
        .cell { width: 32px; height: 32px; background: #fff; border: 1px solid #f0f4f8; display: flex; justify-content: center; align-items: center; font-size: 0.9rem; font-weight: 800; color: var(--azul-escuro); cursor: pointer; border-radius: 6px; transition: 0.2s; }
        .cell.selected { background: var(--azul-bright); color: white; border-color: var(--azul-bright); }
        .cell.found { background: var(--azul-escuro); color: white; border-color: var(--azul-escuro); }
        .words-list { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 15px 0; }
        .word-item { padding: 5px 12px; background: var(--azul-claro); border-radius: 20px; font-size: 0.7rem; font-weight: 700; color: var(--azul-escuro); text-transform: uppercase; }
        .word-item.found { background: #d1d1d1; color: #888; text-decoration: line-through; }
        .btn-style { padding: 12px 20px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; border: 2px solid var(--azul-bright); border-radius: 50px; cursor: pointer; transition: 0.3s; background: white; color: var(--azul-escuro); width: 100%; margin-bottom: 10px; }
        .btn-filled { background: var(--azul-bright); color: white; }
        .message-box { font-size: 0.75rem; font-weight: 800; color: var(--azul-escuro); text-transform: uppercase; min-height: 30px; margin-bottom: 10px; }
        .recorde-text { text-align: center; margin: 5px 0; font-size: 0.7rem; font-weight: 800; color: var(--azul-escuro); }
        @media (max-width: 450px) { .cell { width: 25px; height: 25px; font-size: 0.7rem; } .container { padding: 15px; } }
    </style>
</head>
<body>
    <div class="background-layer"></div>
    <header class="diary-header">
        <div class="header-left">
            <a href="sala-de-jogos-mobile.html" class="back-btn"><i class="fas fa-chevron-left"></i></a>
            <div class="diary-title"><h2>Caça-Palavras</h2></div>
        </div>
        <i class="fas fa-search" style="color: var(--azul-bright); font-size: 1.2rem;"></i>
    </header>
    <div class="container">
        <div id="confettiContainer"></div>
        <div class="screen active" id="menuScreen">
            <div class="message-box">Escolha o nível de dificuldade</div>
            <div style="display: flex; flex-direction: column; gap: 10px;">
                <button class="btn-style" onclick="startGame('easy')">Iniciante (8x8)</button>
                <button class="btn-style" onclick="startGame('medium')">Intermediário (10x10)</button>
                <button class="btn-style" onclick="startGame('hard')">Mestre (12x12)</button>
            </div>
        </div>
        <div class="screen" id="gameScreen">
            <div class="scoreboard">
                <div class="score-bubble"><div class="score-label">Tema</div><div class="score-value" id="themeDisplay">...</div></div>
                <div class="score-bubble"><div class="score-label">Pontos</div><div class="score-value" id="scoreDisplay">0</div></div>
            </div>
            <div class="recorde-text" id="recordeDisplay">?? Melhor: --</div>
            <div class="grid-container"><div class="grid" id="grid"></div></div>
            <div class="words-list" id="wordsList"></div>
            <div class="message-box" id="messageBox">Encontre as palavras!</div>
            <div style="display: flex; gap: 10px;">
                <button class="btn-style" onclick="backToMenu()">Sair</button>
                <button class="btn-style btn-filled" onclick="newGame()">Reiniciar</button>
            </div>
        </div>
    </div>
    <script>
        let matriculaAtual = "";
        let melhorPontuacao = { easy: 0, medium: 0, hard: 0 };
        let difficulty = "medium";
        let gridSize = 10;
        let grid = [];
        let words = [];
        let foundWords = [];
        let selectedCells = [];
        let isSelecting = false;
        let score = 0;

        const themes = {
            easy: [
                { name: "Cores", words: ["AZUL", "VERDE", "ROSA", "ROXO", "AMARELO"] },
                { name: "Frutas", words: ["MACA", "UVA", "PERA", "MANGA", "LIMAO"] },
                { name: "Calma", words: ["PAZ", "ZEN", "FOCO", "RISO", "SONO"] }
            ],
            medium: [
                { name: "Natureza", words: ["FLORESTA", "OCEANO", "MONTANHA", "NUVEM", "SOLAR", "ARVORE"] },
                { name: "Sentimentos", words: ["ALEGRIA", "CALMA", "AMOR", "GRATIDAO", "ESPERANCA"] },
                { name: "Habilidades", words: ["LEITURA", "MUSICA", "PINTURA", "DANCA", "POESIA"] }
            ],
            hard: [
                { name: "Mindfulness", words: ["MINDFULNESS", "PRESENCA", "RESPIRAR", "ATENCAO", "SILENCIO", "EQUILIBRIO"] },
                { name: "Bem-Estar", words: ["MEDITACAO", "AUTOESTIMA", "SAUDE", "HARMONIA", "VITALIDADE", "SERENIDADE"] }
            ]
        };

        async function carregarRecorde() {
            const usuario = JSON.parse(localStorage.getItem("usuario") || "{}");
            matriculaAtual = usuario.matricula;
            if (!matriculaAtual) { window.location.href = "login-mobile.html"; return; }
            try {
                const response = await fetch(`https://mindfine-backend.onrender.com/api/recorde/${matriculaAtual}/caca_palavras_${difficulty}`);
                const dados = await response.json();
                melhorPontuacao[difficulty] = dados.recorde || 0;
                document.getElementById("recordeDisplay").innerHTML = `?? Melhor: ${melhorPontuacao[difficulty] || "--"}`;
            } catch (error) { console.error(error); }
        }

        async function salvarRecorde() {
            if (score <= melhorPontuacao[difficulty]) return;
            try {
                await fetch(`https://mindfine-backend.onrender.com/api/recorde/${matriculaAtual}/caca_palavras_${difficulty}`, {
                    method: "POST", headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ pontuacao: score })
                });
                melhorPontuacao[difficulty] = score;
                document.getElementById("recordeDisplay").innerHTML = `?? Melhor: ${score}`;
            } catch (error) { console.error(error); }
        }

        function startGame(level) {
            difficulty = level;
            gridSize = level === "easy" ? 8 : (level === "medium" ? 10 : 12);
            document.getElementById("menuScreen").classList.remove("active");
            document.getElementById("gameScreen").classList.add("active");
            carregarRecorde().then(() => newGame());
        }

        function backToMenu() {
            document.getElementById("gameScreen").classList.remove("active");
            document.getElementById("menuScreen").classList.add("active");
        }

        function newGame() {
            score = 0;
            foundWords = [];
            selectedCells = [];
            updateScore();
            const themeList = themes[difficulty];
            const selectedTheme = themeList[Math.floor(Math.random() * themeList.length)];
            document.getElementById("themeDisplay").textContent = selectedTheme.name;
            words = selectedTheme.words;
            createGrid();
            placeWords();
            fillEmpty();
            render();
            updateRecordeDisplay();
        }

        function updateRecordeDisplay() {
            const rd = document.getElementById("recordeDisplay");
            if (rd && melhorPontuacao[difficulty] > 0) rd.innerHTML = `?? Melhor: ${melhorPontuacao[difficulty]} pontos`;
            else if (rd) rd.innerHTML = `?? Melhor: --`;
        }

        function createGrid() { grid = Array(gridSize).fill().map(() => Array(gridSize).fill({ letter: "", found: false })); }
        
        function placeWords() {
            words.forEach(word => {
                let placed = false;
                while (!placed) {
                    const isHoriz = Math.random() > 0.5;
                    const row = Math.floor(Math.random() * (isHoriz ? gridSize : gridSize - word.length));
                    const col = Math.floor(Math.random() * (isHoriz ? gridSize - word.length : gridSize));
                    let canPlace = true;
                    for (let i = 0; i < word.length; i++) {
                        const r = isHoriz ? row : row + i;
                        const c = isHoriz ? col + i : col;
                        if (grid[r][c].letter !== "" && grid[r][c].letter !== word[i]) { canPlace = false; break; }
                    }
                    if (canPlace) {
                        for (let i = 0; i < word.length; i++) {
                            const r = isHoriz ? row : row + i;
                            const c = isHoriz ? col + i : col;
                            grid[r][c] = { letter: word[i], found: false };
                        }
                        placed = true;
                    }
                }
            });
        }

        function fillEmpty() {
            const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            for (let r = 0; r < gridSize; r++) {
                for (let c = 0; c < gridSize; c++) {
                    if (!grid[r][c].letter) grid[r][c] = { letter: letters[Math.floor(Math.random() * 26)], found: false };
                }
            }
        }

        function render() {
            const gridElement = document.getElementById("grid");
            gridElement.style.gridTemplateColumns = `repeat(${gridSize}, 1fr)`;
            gridElement.innerHTML = "";
            for (let r = 0; r < gridSize; r++) {
                for (let c = 0; c < gridSize; c++) {
                    const cell = document.createElement("div");
                    cell.className = "cell" + (grid[r][c].found ? " found" : "");
                    cell.textContent = grid[r][c].letter;
                    cell.onmousedown = () => startSelect(r, c);
                    cell.onmouseenter = () => moveSelect(r, c);
                    cell.onmouseup = endSelect;
                    cell.ontouchstart = (e) => { e.preventDefault(); startSelect(r, c); };
                    cell.ontouchmove = (e) => { e.preventDefault(); handleTouchMove(e); };
                    cell.ontouchend = () => endSelect();
                    gridElement.appendChild(cell);
                }
            }
            const wordsList = document.getElementById("wordsList");
            wordsList.innerHTML = words.map(w => `<span class="word-item ${foundWords.includes(w) ? "found" : ""}">${w}</span>`).join("");
        }

        let touchCells = [];
        function handleTouchMove(e) {
            const touch = e.touches[0];
            const target = document.elementFromPoint(touch.clientX, touch.clientY);
            if (target && target.classList.contains("cell")) {
                const index = Array.from(target.parentNode.children).indexOf(target);
                const r = Math.floor(index / gridSize);
                const c = index % gridSize;
                if (!touchCells.some(cell => cell.r === r && cell.c === c)) {
                    touchCells.push({ r, c });
                    updateSelectionTouch();
                }
            }
        }
        function updateSelectionTouch() {
            const allCells = document.querySelectorAll(".cell");
            allCells.forEach(cell => cell.classList.remove("selected"));
            touchCells.forEach(cell => {
                const idx = cell.r * gridSize + cell.c;
                if (allCells[idx]) allCells[idx].classList.add("selected");
            });
        }
        function startSelect(r, c) { isSelecting = true; selectedCells = [{ r, c }]; touchCells = [{ r, c }]; updateSelection(); }
        function moveSelect(r, c) { if (!isSelecting) return; if (!selectedCells.some(cell => cell.r === r && cell.c === c)) { selectedCells.push({ r, c }); updateSelection(); } }
        function updateSelection() { const allCells = document.querySelectorAll(".cell"); allCells.forEach(cell => cell.classList.remove("selected")); selectedCells.forEach(cell => { const idx = cell.r * gridSize + cell.c; if (allCells[idx]) allCells[idx].classList.add("selected"); }); }
        function endSelect() {
            if (!isSelecting) return;
            isSelecting = false;
            touchCells = [];
            const word = selectedCells.map(cell => grid[cell.r][cell.c].letter).join("");
            const reversed = word.split("").reverse().join("");
            if (words.includes(word) && !foundWords.includes(word)) markFound(word);
            else if (words.includes(reversed) && !foundWords.includes(reversed)) markFound(reversed);
            selectedCells = [];
            render();
        }
        function markFound(word) {
            foundWords.push(word);
            selectedCells.forEach(cell => grid[cell.r][cell.c].found = true);
            score += 10;
            updateScore();
            render();
            if (foundWords.length === words.length) { document.getElementById("messageBox").textContent = "?? Incrível! Você achou tudo! ??"; salvarRecorde(); createConfetti(); }
            else { document.getElementById("messageBox").textContent = `? Encontrou "${word}"! +10 pontos`; }
        }
        function updateScore() { document.getElementById("scoreDisplay").textContent = score; }
        function createConfetti() { for (let i = 0; i < 80; i++) { const c = document.createElement("div"); c.style.cssText = `position:fixed;width:8px;height:8px;background:#32B5F1;left:${Math.random()*100}%;top:-10px;border-radius:50%;z-index:2000;pointer-events:none`; document.body.appendChild(c); c.animate([{transform:"translateY(0)",opacity:1},{transform:`translateY(${window.innerHeight}px)`,opacity:0}],{duration:2000}).onfinish=()=>c.remove(); } }
        document.addEventListener("mouseup", () => { if (isSelecting) endSelect(); });
    </script>
</body>
</html>
