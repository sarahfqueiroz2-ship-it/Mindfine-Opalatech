<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Mindfine - Login Mobile</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #29b6f6 0%, #0d47a1 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            background: white;
            border-radius: 32px;
            padding: 32px 24px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }

        .logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 16px;
            background: linear-gradient(135deg, #29b6f6, #0d47a1);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-icon img {
            width: 50px;
            height: 50px;
            object-fit: contain;
        }

        .logo h1 {
            font-size: 28px;
            color: #29b6f6;
            margin-bottom: 4px;
        }

        .logo p {
            font-size: 13px;
            color: #666;
        }

        .role-selector {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            background: #f1f3f4;
            padding: 6px;
            border-radius: 16px;
        }

        .role-btn {
            flex: 1;
            padding: 12px 8px;
            border: none;
            border-radius: 12px;
            background: transparent;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }

        .role-btn.active {
            background: #29b6f6;
            color: white;
            box-shadow: 0 2px 8px rgba(41,182,246,0.3);
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #37474f;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper input {
            width: 100%;
            padding: 14px 48px 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 14px;
            font-size: 16px;
            background: white;
            transition: 0.2s;
        }

        .input-wrapper input:focus {
            outline: none;
            border-color: #29b6f6;
        }

        .password-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
        }

        .password-toggle svg {
            width: 22px;
            height: 22px;
            color: #90a4ae;
        }

        .login-btn {
            width: 100%;
            padding: 16px;
            background: #29b6f6;
            border: none;
            border-radius: 14px;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 8px;
        }

        .login-btn:active {
            transform: scale(0.98);
            background: #0288d1;
        }

        .login-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .mensagem {
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 13px;
            font-weight: 500;
            display: none;
        }

        .mensagem.erro {
            background: #ffebee;
            color: #c62828;
        }

        .mensagem.sucesso {
            background: #e8f5e9;
            color: #2e7d32;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 20px;
        }

        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid #e0e0e0;
            border-top-color: #29b6f6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Footer */
        .footer {
            text-align: center;
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid #f0f0f0;
        }

        .footer p {
            font-size: 11px;
            color: #999;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo">
            <div class="logo-icon">
                <img src="../pandas/skin.png" alt="Mindfine">
            </div>
            <h1>Mindfine</h1>
            <p>Cuidar da mente é construir o futuro!</p>
        </div>

        <div id="mensagem" class="mensagem"></div>

        <div class="role-selector">
            <button class="role-btn active" data-role="estudante"> Estudante</button>
            <button class="role-btn" data-role="gestao"> Gestão</button>
            <button class="role-btn" data-role="psicologia"> Psicologia</button>
        </div>

        <form id="loginForm">
            <div class="input-group">
                <label id="userLabel">Matrícula / Email</label>
                <div class="input-wrapper">
                    <input type="text" id="identificador" placeholder="Digite sua matrícula ou email" required>
                </div>
            </div>

            <div class="input-group">
                <label>Senha</label>
                <div class="input-wrapper">
                    <input type="password" id="senha" placeholder="Digite sua senha" required>
                    <button type="button" class="password-toggle" onclick="togglePassword()">
                        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                            <line x1="1" y1="1" x2="23" y2="23"/>
                        </svg>
                    </button>
                </div>
            </div>

            <button type="submit" class="login-btn" id="btnLogin">Entrar</button>
        </form>

        <div class="footer">
            <p>Mindfine © 2024 - Bem-estar escolar</p>
        </div>
    </div>

    <script>
        let tipoSelecionado = 'estudante';

        // Gerenciar papel selecionado
        document.querySelectorAll('.role-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                tipoSelecionado = btn.dataset.role;
                
                const label = document.getElementById('userLabel');
                if (tipoSelecionado === 'estudante') label.textContent = 'Matrícula / Email';
                else if (tipoSelecionado === 'gestao') label.textContent = 'ID de Gestor';
                else label.textContent = 'CRP ou Email Profissional';
            });
        });

        // Toggle senha
        function togglePassword() {
            const senhaInput = document.getElementById('senha');
            const type = senhaInput.type === 'password' ? 'text' : 'password';
            senhaInput.type = type;
        }

        function mostrarMensagem(texto, tipo) {
            const msgDiv = document.getElementById('mensagem');
            msgDiv.textContent = texto;
            msgDiv.className = `mensagem ${tipo}`;
            msgDiv.style.display = 'block';
            setTimeout(() => {
                msgDiv.style.display = 'none';
            }, 4000);
        }

        // Login
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btnLogin = document.getElementById('btnLogin');
            const identificador = document.getElementById('identificador').value.trim();
            const senha = document.getElementById('senha').value;
            
            if (!identificador || !senha) {
                mostrarMensagem('Preencha todos os campos!', 'erro');
                return;
            }
            
            btnLogin.disabled = true;
            btnLogin.innerHTML = '<div class="spinner"></div>';
            
            try {
                const resposta = await fetch('https://mindfine-backend.onrender.com/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        tipo_usuario: tipoSelecionado,
                        identificador: identificador,
                        senha: senha
                    })
                });
                
                const dados = await resposta.json();
                
                if (dados.sucesso) {
                    localStorage.setItem('usuario', JSON.stringify({
                        nome: dados.nome,
                        email: dados.email,
                        matricula: dados.matricula,
                        tipo: dados.tipo
                    }));
                    
                    mostrarMensagem('Login realizado com sucesso!', 'sucesso');
                    
                    let paginaDestino = '../inicial.html';
                    if (tipoSelecionado === 'gestao') paginaDestino = '../inicio-escola.html';
                    else if (tipoSelecionado === 'psicologia') paginaDestino = '../inicial-psicologa.html';
                    
                    setTimeout(() => {
                        window.location.href = paginaDestino;
                    }, 1500);
                } else {
                    mostrarMensagem(dados.mensagem || 'Credenciais inválidas', 'erro');
                }
            } catch (erro) {
                console.error('Erro:', erro);
                mostrarMensagem('Erro de conexão com o servidor!', 'erro');
            } finally {
                btnLogin.disabled = false;
                btnLogin.innerHTML = 'Entrar';
            }
        });
    </script>
</body>
</html>
