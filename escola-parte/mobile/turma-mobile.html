<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Mindfine - Turmas</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: #000;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .background-layer { z-index: 0;
            position: fixed;
            width: 110%;
            height: 110%;
            background-image: url('../fundos/fundo-a.png');
            background-size: cover;
            background-position: center;
            z-index: 0;
            left: -5%;
            top: -5%;
            filter: blur(8px) brightness(0.6);
        }

        /* Header Mobile */
        .mobile-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: rgba(255,255,255,0.95);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(0,0,0,0.08);
        }

        .logo {
            font-size: 18px;
            font-weight: 800;
            background: linear-gradient(90deg, #32B5F1, #0277bd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .menu-toggle {
            background: none;
            border: none;
            font-size: 22px;
            color: #32B5F1;
            cursor: pointer;
        }

        /* Sidebar */
        .sidebar {
            position: fixed;
            top: 0;
            left: -280px;
            width: 280px;
            height: 100vh;
            background: rgba(255,255,255,0.98);
            backdrop-filter: blur(20px);
            z-index: 200;
            padding: 70px 16px 20px;
            transition: left 0.3s ease;
            box-shadow: 2px 0 20px rgba(0,0,0,0.1);
        }

        .sidebar.open {
            left: 0;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .close-sidebar {
            font-size: 22px;
            color: #64748b;
            cursor: pointer;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            border-radius: 12px;
            color: #64748b;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            margin-bottom: 6px;
        }

        .nav-item.active {
            background: #e3f2fd;
            color: #0277bd;
        }

        .nav-item i {
            width: 20px;
            color: #32B5F1;
        }

        .nav-badge {
            margin-left: auto;
            background: #ef4444;
            color: white;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 20px;
        }

        .user-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px;
            border-top: 1px solid rgba(0,0,0,0.08);
            margin-top: 20px;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #32B5F1, #0277bd);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
        }

        .logout-item {
            color: #f87171 !important;
            margin-top: 10px;
        }

        /* Conteúdo principal */
        .main-content { position: relative; z-index: 10;
            position: relative;
            z-index: 10;
            padding: 70px 16px 30px;
        }

        .page-header {
            background: white;
            padding: 20px;
            border-radius: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
        }

        .page-title {
            font-size: 20px;
            font-weight: 800;
            color: #0277bd;
            margin-bottom: 4px;
        }

        .page-title span {
            background: linear-gradient(90deg, #32B5F1, #0277bd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .page-subtitle {
            font-size: 12px;
            color: #666;
        }

        /* Summary Strip */
        .summary-strip {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .summary-chip {
            background: white;
            border-radius: 16px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
        }

        .chip-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .chip-icon.blue { background: rgba(50,181,241,0.12); color: #32B5F1; }
        .chip-icon.green { background: rgba(52,211,153,0.12); color: #34d399; }
        .chip-icon.purple { background: rgba(139,92,246,0.12); color: #8b5cf6; }
        .chip-icon.yellow { background: rgba(251,191,36,0.12); color: #fbbf24; }

        .chip-value {
            font-size: 24px;
            font-weight: 800;
            color: #0277bd;
            line-height: 1;
        }

        .chip-label {
            font-size: 10px;
            color: #64748b;
            font-weight: 800;
            text-transform: uppercase;
        }

        /* Toolbar */
        .toolbar {
            background: white;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .search-box {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #f8fafc;
            border: 2px solid #f0f0f0;
            border-radius: 12px;
            padding: 10px 16px;
        }

        .search-box input {
            background: transparent;
            border: none;
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            outline: none;
            width: 100%;
            font-weight: 600;
        }

        .filter-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-chip {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border-radius: 12px;
            border: 2px solid #f0f0f0;
            background: #f8fafc;
            flex: 1;
        }

        .filter-chip label {
            font-size: 10px;
            color: #64748b;
            text-transform: uppercase;
            font-weight: 800;
        }

        .filter-chip select {
            background: transparent;
            border: none;
            font-family: 'Montserrat', sans-serif;
            font-size: 13px;
            font-weight: 600;
            outline: none;
            flex: 1;
        }

        .view-toggle {
            display: flex;
            background: #f8fafc;
            border: 2px solid #f0f0f0;
            border-radius: 12px;
            overflow: hidden;
        }

        .view-btn {
            padding: 10px 16px;
            background: transparent;
            border: none;
            color: #64748b;
            cursor: pointer;
            font-size: 16px;
        }

        .view-btn.active {
            background: #e3f2fd;
            color: #0277bd;
        }

        /* Classes Grid */
        .classes-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .class-card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
            cursor: pointer;
        }

        .card-accent {
            height: 4px;
            background: linear-gradient(90deg, #32B5F1, #60a5fa);
        }

        .card-body {
            padding: 16px;
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .class-name {
            font-size: 16px;
            font-weight: 800;
            color: #1e293b;
        }

        .class-meta {
            font-size: 11px;
            color: #64748b;
            font-weight: 600;
        }

        .wellbeing-score {
            font-size: 20px;
            font-weight: 800;
        }

        .score-high { color: #10b981; }
        .score-mid { color: #f59e0b; }
        .score-low { color: #ef4444; }

        .wellbeing-label {
            font-size: 9px;
            color: #64748b;
            text-transform: uppercase;
        }

        .mini-emotions {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin: 12px 0;
        }

        .mini-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .mini-emoji {
            font-size: 12px;
            width: 20px;
        }

        .mini-track {
            flex: 1;
            height: 6px;
            background: #f0f4f8;
            border-radius: 4px;
            overflow: hidden;
        }

        .mini-fill {
            height: 100%;
            border-radius: 4px;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 12px;
            border-top: 1px solid #f0f4f8;
        }

        .student-faces {
            display: flex;
        }

        .face-bubble {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #32B5F1;
            border: 2px solid white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 800;
            color: white;
            margin-left: -6px;
        }

        .face-bubble:first-child { margin-left: 0; }

        .face-count {
            font-size: 11px;
            color: #64748b;
            font-weight: 800;
        }

        /* Drawer Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 300;
            background: rgba(0,0,0,0.65);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .modal-overlay.open {
            opacity: 1;
            pointer-events: all;
        }

        .drawer {
            width: 100%;
            max-height: 85vh;
            background: white;
            border-radius: 24px 24px 0 0;
            overflow-y: auto;
            transform: translateY(100%);
            transition: transform 0.35s cubic-bezier(0.4,0,0.2,1);
        }

        .modal-overlay.open .drawer {
            transform: translateY(0);
        }

        .drawer-header {
            padding: 20px;
            border-bottom: 1px solid #f0f4f8;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            background: white;
        }

        .drawer-close {
            width: 34px;
            height: 34px;
            background: #f1f5f9;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 18px;
        }

        .drawer-body {
            padding: 20px;
        }

        .drawer-class-name {
            font-size: 20px;
            font-weight: 800;
            color: #1e293b;
        }

        .drawer-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin: 20px 0;
        }

        .d-stat {
            background: #f8fafc;
            border-radius: 12px;
            padding: 12px;
            text-align: center;
        }

        .d-stat-val {
            font-size: 20px;
            font-weight: 800;
        }

        .d-stat-lbl {
            font-size: 10px;
            color: #64748b;
            text-transform: uppercase;
        }

        .section-heading {
            font-size: 12px;
            font-weight: 800;
            color: #64748b;
            text-transform: uppercase;
            margin: 16px 0 12px;
        }

        /* Partículas */
        #particles-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .bubble {
            position: absolute;
            bottom: -20px;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            animation: rise linear forwards;
        }

        @keyframes rise {
            to { transform: translateY(-110vh); opacity: 0; }
        }
    .background-layer, #particles-container { z-index: 0 !important; } .main-content, .entries-area, .container, .card, .content-section { position: relative; z-index: 10 !important; } </style>
</head>
<body>

<div class="background-layer"></div>
<div id="particles-container"></div>

<!-- Header Mobile -->
<div class="mobile-header">
    <button class="menu-toggle" id="menuToggle">
        <i class="fas fa-bars"></i>
    </button>
    <div class="logo">Mindfine</div>
    <div style="width: 30px;"></div>
</div>

<!-- Sidebar -->
<div class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <div class="logo">Mindfine</div>
        <div class="close-sidebar" onclick="closeSidebar()">✕</div>
    </div>
    <a href="inicio-escola-mobile.html" class="nav-item">
        <i class="fas fa-tachometer-alt"></i> Painel Geral
    </a>
    <a href="turma-mobile.html" class="nav-item active">
        <i class="fas fa-users"></i> Turmas
    </a>
    <a href="relatorio-mobile.html" class="nav-item">
        <i class="fas fa-chart-line"></i> Relatórios
    </a>
    <a href="alertas-mobile.html" class="nav-item">
        <i class="fas fa-bell"></i> Alertas
        <span class="nav-badge" id="sidebarBadge">0</span>
    </a>
    <a href="intervencao-mobile.html" class="nav-item">
        <i class="fas fa-bullseye"></i> Intervenções
    </a>
    <div class="user-card">
        <div class="user-avatar">EP</div>
        <div>
            <div style="font-size: 13px; font-weight: 600; color: #0097dd;">Escola Painel</div>
            <div style="font-size: 11px; color: #64748b;">Administrador</div>
        </div>
    </div>
    <a href="login-mobile.html" class="nav-item logout-item">
        <i class="fas fa-sign-out-alt"></i> Sair
    </a>
</div>

<!-- Conteúdo principal -->
<main class="main-content">
    <div class="page-header">
        <h1 class="page-title">Visão de <span>Turmas</span></h1>
        <p class="page-subtitle" id="totalTurmasMsg">Carregando...</p>
    </div>

    <div class="summary-strip">
        <div class="summary-chip">
            <div class="chip-icon blue"><i class="fas fa-users"></i></div>
            <div>
                <div class="chip-value" id="totalTurmas">0</div>
                <div class="chip-label">Turmas Ativas</div>
            </div>
        </div>
        <div class="summary-chip">
            <div class="chip-icon green"><i class="fas fa-graduation-cap"></i></div>
            <div>
                <div class="chip-value" id="totalAlunos">0</div>
                <div class="chip-label">Alunos Total</div>
            </div>
        </div>
        <div class="summary-chip" onclick="window.location='relatorio-mobile.html'">
            <div class="chip-icon purple"><i class="fas fa-heart"></i></div>
            <div>
                <div class="chip-value" id="bemEstar">0</div>
                <div class="chip-label">Bem-estar Médio</div>
            </div>
        </div>
        <div class="summary-chip" onclick="window.location='alertas-mobile.html'">
            <div class="chip-icon yellow"><i class="fas fa-exclamation-triangle"></i></div>
            <div>
                <div class="chip-value" id="totalAlertas">0</div>
                <div class="chip-label">Alertas Ativos</div>
            </div>
        </div>
    </div>

    <div class="toolbar">
        <div class="search-box">
            <i class="fas fa-search" style="color: #64748b;"></i>
            <input type="text" id="searchInput" placeholder="Buscar turma ou curso..." oninput="filterCards()">
        </div>
        <div class="filter-row">
            <div class="filter-chip">
                <label>Ano</label>
                <select id="filterYear" onchange="filterCards()">
                    <option value="all">Todos</option>
                    <option value="1">1º Ano</option>
                    <option value="2">2º Ano</option>
                    <option value="3">3º Ano</option>
                </select>
            </div>
            <div class="filter-chip">
                <label>Curso</label>
                <select id="filterCourse" onchange="filterCards()">
                    <option value="all">Todos</option>
                    <option value="Informática">Informática</option>
                    <option value="Administração">Administração</option>
                    <option value="Meio Ambiente">Meio Ambiente</option>
                </select>
            </div>
        </div>
        <div class="view-toggle">
            <button class="view-btn active" id="btnGrid" onclick="setView('grid')"><i class="fas fa-th"></i></button>
            <button class="view-btn" id="btnList" onclick="setView('list')"><i class="fas fa-list"></i></button>
        </div>
    </div>

    <div id="classesContainer"></div>
</main>

<!-- Drawer Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="closeDrawer(event)">
    <div class="drawer" id="drawer">
        <div class="drawer-header">
            <div class="drawer-class-name" id="drawerName">—</div>
            <button class="drawer-close" onclick="closeDrawerBtn()"><i class="fas fa-times"></i></button>
        </div>
        <div class="drawer-body" id="drawerBody"></div>
    </div>
</div>

<script>
    let turmas = [];
    let currentView = 'grid';
    let searchTerm = '';
    let filterCurso = 'all';
    let filterAno = 'all';

    // Sidebar
    const menuToggle = document.getElementById('menuToggle');
    const sidebar = document.getElementById('sidebar');

    function closeSidebar() {
        sidebar.classList.remove('open');
    }

    menuToggle.onclick = () => {
        sidebar.classList.toggle('open');
    };

    document.addEventListener('click', (e) => {
        if (sidebar.classList.contains('open') && !sidebar.contains(e.target) && !menuToggle.contains(e.target)) {
            sidebar.classList.remove('open');
        }
    });

    // Partículas
    function createBubble() {
        const container = document.getElementById('particles-container');
        if (!container) return;
        const b = document.createElement('div');
        b.className = 'bubble';
        const size = Math.random() * 20 + 5;
        b.style.width = size + 'px';
        b.style.height = size + 'px';
        b.style.left = Math.random() * 100 + '%';
        b.style.animationDuration = (Math.random() * 5 + 8) + 's';
        container.appendChild(b);
        setTimeout(() => b.remove(), 10000);
    }
    setInterval(createBubble, 1500);

    // Carregar dados
    async function carregarTurmas() {
        try {
            const response = await fetch('https://mindfine-backend.onrender.com/api/escola/turmas');
            turmas = await response.json();
            render();
            carregarEstatisticas();
        } catch (error) {
            console.error('Erro:', error);
            turmas = [];
            render();
        }
    }

    async function carregarEstatisticas() {
        try {
            const response = await fetch('https://mindfine-backend.onrender.com/api/escola/estatisticas');
            const dados = await response.json();
            document.getElementById('totalTurmas').textContent = turmas.length;
            document.getElementById('totalTurmasMsg').textContent = turmas.length + " turmas ativas";
            document.getElementById('totalAlunos').textContent = dados.totalAlunos || 0;
            document.getElementById('bemEstar').textContent = dados.nivelMedio || 0;
        } catch (error) {
            console.error('Erro:', error);
        }
    }

    async function carregarAlertas() {
        try {
            const response = await fetch('https://mindfine-backend.onrender.com/api/alertas');
            const alertas = await response.json();
            const ativos = alertas.filter(a => a.resolvido !== 1).length;
            document.getElementById('totalAlertas').textContent = ativos;
            document.getElementById('sidebarBadge').textContent = ativos;
        } catch (error) {
            console.error('Erro:', error);
        }
    }

    function getFilteredTurmas() {
        return turmas.filter(turma => {
            const matchSearch = searchTerm === '' || turma.nome.toLowerCase().includes(searchTerm.toLowerCase());
            const matchCurso = filterCurso === 'all' || turma.nome.includes(filterCurso);
            const matchAno = filterAno === 'all' || turma.nome.startsWith(filterAno);
            return matchSearch && matchCurso && matchAno;
        });
    }

    function getScoreClass(score) {
        if (score >= 7) return 'score-high';
        if (score >= 5) return 'score-mid';
        return 'score-low';
    }

    function renderGrid(lista) {
        return `
            <div class="classes-grid">
                ${lista.map(turma => `
                    <div class="class-card" onclick="abrirModalTurma('${turma.nome.replace(/'/g, "\\'")}')">
                        <div class="card-accent"></div>
                        <div class="card-body">
                            <div class="card-top">
                                <div>
                                    <div class="class-name">${turma.nome}</div>
                                    <div class="class-meta">${turma.alunos.length} alunos</div>
                                </div>
                                <div>
                                    <div class="wellbeing-score ${getScoreClass(turma.nivelMedio)}">${turma.nivelMedio}</div>
                                    <div class="wellbeing-label">Nível Médio</div>
                                </div>
                            </div>
                            <div class="mini-emotions">
                                <div class="mini-row">
                                    <span class="mini-emoji">💰</span>
                                    <div class="mini-track"><div class="mini-fill" style="width: ${Math.min(100, turma.totalMoedas / 100)}%; background: #fbbf24;"></div></div>
                                    <span class="mini-pct">${turma.totalMoedas} moedas</span>
                                </div>
                                <div class="mini-row">
                                    <span class="mini-emoji">⭐</span>
                                    <div class="mini-track"><div class="mini-fill" style="width: ${Math.min(100, turma.totalXP / 100)}%; background: #32B5F1;"></div></div>
                                    <span class="mini-pct">${turma.totalXP} XP</span>
                                </div>
                            </div>
                            <div class="card-footer">
                                <div class="student-faces">
                                    ${turma.alunos.slice(0, 4).map((_, i) => `<div class="face-bubble">${i+1}</div>`).join('')}
                                </div>
                                <span class="face-count">${turma.alunos.length} alunos</span>
                                <div class="alert-tag no-alerts">0 alertas</div>
                            </div>
                        </div>
                    </div>
                `).join('')}
            </div>
        `;
    }

    function renderList(lista) {
        return `
            <div class="classes-grid">
                ${lista.map(turma => `
                    <div class="class-card" onclick="abrirModalTurma('${turma.nome.replace(/'/g, "\\'")}')">
                        <div class="card-accent"></div>
                        <div class="card-body">
                            <div style="display: flex; justify-content: space-between; align-items: center;">
                                <div>
                                    <div class="class-name">${turma.nome}</div>
                                    <div class="class-meta">${turma.alunos.length} alunos · Nível ${turma.nivelMedio}</div>
                                </div>
                                <i class="fas fa-chevron-right" style="color: #64748b;"></i>
                            </div>
                        </div>
                    </div>
                `).join('')}
            </div>
        `;
    }

    function render() {
        const filtered = getFilteredTurmas();
        const container = document.getElementById('classesContainer');
        if (filtered.length === 0) {
            container.innerHTML = '<div style="background:white; border-radius:16px; padding:40px; text-align:center;">Nenhuma turma encontrada</div>';
            return;
        }
        container.innerHTML = currentView === 'grid' ? renderGrid(filtered) : renderList(filtered);
    }

    function filterCards() {
        searchTerm = document.getElementById('searchInput')?.value || '';
        filterAno = document.getElementById('filterYear')?.value || 'all';
        filterCurso = document.getElementById('filterCourse')?.value || 'all';
        render();
    }

    function setView(view) {
        currentView = view;
        document.getElementById('btnGrid').classList.toggle('active', view === 'grid');
        document.getElementById('btnList').classList.toggle('active', view === 'list');
        render();
    }

    function abrirModalTurma(nomeTurma) {
        const turma = turmas.find(t => t.nome === nomeTurma);
        if (!turma) return;

        document.getElementById('drawerName').textContent = turma.nome;
        document.getElementById('drawerBody').innerHTML = `
            <div class="drawer-stats">
                <div class="d-stat"><div class="d-stat-val">${turma.alunos.length}</div><div class="d-stat-lbl">Alunos</div></div>
                <div class="d-stat"><div class="d-stat-val">${turma.totalMoedas}</div><div class="d-stat-lbl">Moedas</div></div>
                <div class="d-stat"><div class="d-stat-val">${turma.totalXP}</div><div class="d-stat-lbl">XP Total</div></div>
            </div>
            <div class="section-heading">Lista de Alunos</div>
            <div style="display: flex; flex-direction: column; gap: 8px;">
                ${turma.alunos.map(aluno => `
                    <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px; background: #f8fafc; border-radius: 10px;">
                        <div><div style="font-weight: 800;">${aluno.nome}</div><div style="font-size: 10px; color: #64748b;">${aluno.matricula}</div></div>
                        <div style="text-align: right;"><div style="font-weight: 800; color: #32B5F1;">NV. ${aluno.nivel || 1}</div><div style="font-size: 10px;">${aluno.moedas || 0} 🪙</div></div>
                    </div>
                `).join('')}
            </div>
        `;
        document.getElementById('modalOverlay').classList.add('open');
    }

    function closeDrawer(e) {
        if (e.target === document.getElementById('modalOverlay')) {
            document.getElementById('modalOverlay').classList.remove('open');
        }
    }

    function closeDrawerBtn() {
        document.getElementById('modalOverlay').classList.remove('open');
    }

    window.filterCards = filterCards;
    window.setView = setView;
    window.abrirModalTurma = abrirModalTurma;
    window.closeDrawer = closeDrawer;
    window.closeDrawerBtn = closeDrawerBtn;

    carregarTurmas();
    carregarAlertas();
    setInterval(carregarAlertas, 30000);
</script>
</body>
</html>
