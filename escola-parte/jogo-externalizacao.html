<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mindfine - Externaliza√ß√£o</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <style>
        :root {
            --azul-bright: #32B5F1;
            --azul-escuro: #0277bd;
            --branco: #ffffff;
            --neon-texto: 0 0 10px rgba(255, 255, 255, 0.8), 0 0 20px rgba(255, 255, 255, 0.4);
        }

        body, html {
            margin: 0; padding: 0;
            font-family: 'Montserrat', sans-serif;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        /* --- FUNDO --- */
        .background-layer {
            position: fixed; width: 110%; height: 110%;
            background-color: #001a2d; /* Cor de seguran√ßa caso a imagem falhe */
            background-image: url('fundos/fundo-a.png'); 
            background-size: cover; background-position: center;
            z-index: 1; left: -5%; top: -5%;
            filter: blur(8px) brightness(0.6);
        }

        /* --- HEADER --- */
        .diary-header {
            position: fixed; top: 0; left: 0; width: 100%;
            background: white; padding: 15px 20px;
            display: flex; align-items: center; gap: 15px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.1);
            z-index: 500;
            box-sizing: border-box;
        }
        .header-left { display: flex; align-items: center; gap: 15px; flex-grow: 1; }
        .back-btn { color: var(--azul-bright); font-size: 1.2rem; cursor: pointer; border: none; background: none; text-decoration: none; }
        .diary-title h2 { margin: 0; font-size: 1rem; color: var(--azul-escuro); font-weight: 800; text-transform: uppercase; }

        /* CANVAS - Garantir que fique acima do fundo e abaixo da UI */
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 10;
            display: block;
            touch-action: none;
        }

        /* --- √ÅREA DE INPUT --- */
        #ui-input-container {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 500px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .input-wrapper {
            width: 100%;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .thought-input {
            flex-grow: 1;
            background: white;
            border: 2px solid var(--azul-bright);
            border-radius: 30px;
            padding: 15px 25px;
            color: var(--azul-escuro);
            font-family: 'Montserrat', sans-serif;
            font-size: 1rem;
            outline: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .send-btn {
            background: var(--azul-bright);
            color: white;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            box-shadow: 0 4px 15px rgba(50, 181, 241, 0.4);
            transition: 0.3s;
        }

        .send-btn:active {
            transform: scale(0.9);
        }

        .instruction {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #fff;
            font-weight: 800;
            text-shadow: var(--neon-texto);
            animation: pulse 2s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

    


@media (max-width: 480px) {

    .page-header { padding: 15px; }
    .page-title { font-size: 18px; }

}

/* Para telas muito pequenas (menos de 400px) */

    .kpi-strip, .stats-grid, .summary-strip {

<body>

    <div class="background-layer"></div>

    <header class="diary-header" id="mainHeader">
        <div class="header-left">
            <a href="sala-de-jogos.html" class="back-btn"><i class="fas fa-chevron-left"></i></a>
            <div class="diary-title">
                <h2>Vazio Sereno</h2>
            </div>
        </div>
        <i class="fas fa-wind" style="color: var(--azul-bright); font-size: 1.2rem;"></i>
    </header>

    <canvas id="world"></canvas>

    <div id="ui-input-container">
        <div class="input-wrapper">
            <input type="text" id="thoughtField" class="thought-input" placeholder="O que quer soltar?" autocomplete="off">
            <button id="sendBtn" class="send-btn"><i class="fas fa-paper-plane"></i></button>
        </div>
        <div class="instruction">Toque no √≠cone ou aperte Enter para soltar</div>
    </div>
    
  <script>
    // ========== FUN√á√ÉO DE NOTIFICA√á√ÉO ==========
    function showNotif(title, msg, type = 'info') {
        const notif = document.createElement('div');
        notif.style.cssText = `
            position: fixed; top: 30px; left: 50%; transform: translateX(-50%);
            background: white; border-radius: 20px; padding: 15px 25px;
            display: flex; align-items: center; gap: 12px; z-index: 10001;
            border: 2px solid ${type === 'success' ? '#4CAF50' : '#32B5F1'};
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            animation: fadeInOut 3s forwards;
        `;
        notif.innerHTML = `
            <i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-info-circle'}" style="color: ${type === 'success' ? '#4CAF50' : '#32B5F1'}; font-size: 1.5rem;"></i>
            <div><div style="font-weight: 800; color: #0277bd;">${title}</div><div style="font-size: 0.8rem; color: #666;">${msg}</div></div>
        `;
        document.body.appendChild(notif);
        setTimeout(() => notif.remove(), 3000);
    }

    // Adicionar anima√ß√£o CSS
    const style = document.createElement('style');
    style.textContent = `
        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateX(-50%) translateY(20px); }
            15% { opacity: 1; transform: translateX(-50%) translateY(0); }
            85% { opacity: 1; transform: translateX(-50%) translateY(0); }
            100% { opacity: 0; transform: translateX(-50%) translateY(-20px); }
        }
    `;
    document.head.appendChild(style);

    // C√≥digo do jogo
    const canvas = document.getElementById('world');
    const ctx = canvas.getContext('2d');
    const input = document.getElementById('thoughtField');
    const sendBtn = document.getElementById('sendBtn');
    const headerElement = document.getElementById('mainHeader');

    let thoughts = [];
    let particles = [];
    let headerHeight = headerElement.offsetHeight;

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        headerHeight = headerElement.offsetHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    class Particle {
        constructor(x, y, color) {
            this.x = x; this.y = y;
            this.size = Math.random() * 3;
            this.vx = (Math.random() - 0.5) * 6;
            this.vy = (Math.random() - 0.5) * 6;
            this.alpha = 1; this.color = color;
        }
        update() { this.x += this.vx; this.y += this.vy; this.alpha -= 0.02; }
        draw() {
            ctx.save();
            ctx.globalAlpha = this.alpha;
            ctx.fillStyle = this.color;
            ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
            ctx.restore();
        }
    }

    class Thought {
        constructor(text) {
            this.text = text;
            this.x = Math.random() * (canvas.width - 100) + 50;
            this.y = canvas.height + 100;
            this.vx = (Math.random() - 0.5) * 1;
            this.vy = -Math.random() * 2 - 1.5;
            const charCount = text.length;
            this.radius = Math.max(45, Math.sqrt(charCount * 180) + 20);
            this.atCeiling = false;
            this.jiggleOffset = Math.random() * 1000;
        }

        update() {
            if (!this.atCeiling) {
                this.x += this.vx;
                this.y += this.vy;
                if (this.y - this.radius <= headerHeight) {
                    this.y = headerHeight + this.radius + 5;
                    this.atCeiling = true;
                    this.vy = 0;
                }
            } else {
                this.x += Math.sin((Date.now() + this.jiggleOffset) / 1000) * 0.5;
            }
            if (this.x < this.radius || this.x > canvas.width - this.radius) {
                this.vx *= -1;
            }
        }

        draw() {
            ctx.save();
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius + 15, 0, Math.PI * 2);
            let grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.radius + 15);
            grad.addColorStop(0, 'rgba(50, 181, 241, 0.3)');
            grad.addColorStop(1, 'transparent');
            ctx.fillStyle = grad; 
            ctx.fill();

            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
            ctx.fill();
            ctx.strokeStyle = 'rgba(50, 181, 241, 0.5)';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(this.x - this.radius * 0.4, this.y - this.radius * 0.4, this.radius * 0.1, 0, Math.PI * 2);
            ctx.fillStyle = 'white';
            ctx.fill();

            ctx.fillStyle = '#0277bd';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            const fontSize = 15;
            ctx.font = `600 ${fontSize}px Montserrat`;
            this.wrapText(this.text, this.x, this.y, this.radius * 1.5, fontSize + 4);
            ctx.restore();
        }

        wrapText(text, x, y, maxWidth, lineHeight) {
            const words = text.split(' ');
            let line = '';
            let lines = [];
            for (let n = 0; n < words.length; n++) {
                let testLine = line + words[n] + ' ';
                let metrics = ctx.measureText(testLine);
                if (metrics.width > maxWidth && n > 0) {
                    lines.push(line);
                    line = words[n] + ' ';
                } else {
                    line = testLine;
                }
            }
            lines.push(line);
            let totalHeight = lines.length * lineHeight;
            let startY = y - (totalHeight / 2) + (lineHeight / 2);
            lines.forEach((l, i) => {
                ctx.fillText(l.trim(), x, startY + (i * lineHeight));
            });
        }

        pop() {
            for (let i = 0; i < 25; i++) {
                particles.push(new Particle(this.x, this.y, '#32B5F1'));
            }
        }
    }

    function releaseThought() {
        const val = input.value.trim();
        if (val !== "") {
            thoughts.push(new Thought(val));
            input.value = "";
        }
    }

    sendBtn.addEventListener('click', releaseThought);
    input.addEventListener('keypress', (e) => { 
        if (e.key === 'Enter') releaseThought(); 
    });

    window.addEventListener('pointerdown', (e) => {
        const mx = e.clientX; 
        const my = e.clientY;
        for (let i = thoughts.length - 1; i >= 0; i--) {
            let t = thoughts[i];
            let dist = Math.sqrt((mx - t.x)**2 + (my - t.y)**2);
            if (dist < t.radius) {
                t.pop();
                thoughts.splice(i, 1);
                break;
            }
        }
    });

    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (let i = particles.length - 1; i >= 0; i--) {
            particles[i].update();
            particles[i].draw();
            if (particles[i].alpha <= 0) particles.splice(i, 1);
        }
        thoughts.forEach(t => {
            t.update();
            t.draw();
        });
        requestAnimationFrame(animate);
    }
    animate();
</script>
